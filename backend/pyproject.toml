[project]
name = "jobpilot-backend"
version = "0.1.0"
description = "JobPilot — autonomous, human-in-the-loop job application agent (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.optional-dependencies]
# Browser automation for the application agent. Install with:
#   uv sync --extra browser && uv run playwright install chromium
browser = [
    "playwright>=1.47",
]
# Real LLM provider for grounded answer drafting / resume tailoring. Optional —
# the app runs fully on the deterministic offline provider without it. Install:
#   uv sync --extra llm   (then set JOBPILOT_ANTHROPIC_API_KEY=...)
llm = [
    "anthropic>=0.39",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
